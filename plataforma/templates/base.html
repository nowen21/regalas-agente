<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Cimiento{% endblock %}</title>
  {# Sin nada que salga a la red: la plataforma tiene que servir sin conexión (RNF-03). #}
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1c1c1c;
           background: #f6f6f4; }
    header { background: #23303d; color: #fff; padding: 1rem 1.5rem; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    main { max-width: 60rem; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    h2 { font-size: 1.1rem; margin: 2rem 0 .6rem; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { text-align: left; padding: .55rem .7rem; border-bottom: 1px solid #e3e3e0; }
    th { background: #eeeeea; font-weight: 600; }
    .vacio { background: #fff; border: 1px dashed #c9c9c4; padding: 1.2rem;
             color: #555; }
    .aviso { background: #fff8e1; border-left: 4px solid #d5a021; padding: .7rem 1rem;
             margin: .5rem 0; }
    .error { background: #fdecea; border-left: 4px solid #c0392b; padding: .7rem 1rem;
             margin: .5rem 0; }
    .bien { background: #eaf6ec; border-left: 4px solid #3a8f4f; padding: .7rem 1rem;
            margin: .5rem 0; }
    form { background: #fff; padding: 1rem; border: 1px solid #e3e3e0; }
    label { display: block; margin: .6rem 0 .2rem; font-weight: 600; }
    input[type=text] { width: 100%; padding: .5rem; border: 1px solid #c9c9c4; }
    button { margin-top: .9rem; padding: .55rem 1.1rem; background: #23303d;
             color: #fff; border: 0; cursor: pointer; }
    .apagado { color: #777; }
    pre { background: #fff; border: 1px solid #e3e3e0; padding: 1rem;
          overflow-x: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header><a href="{% url 'proyectos-lista' %}">Cimiento</a></header>
  <main>{% block cuerpo %}{% endblock %}</main>
</body>
</html>
