{% load static %}<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - Cimiento</title>
  <link rel="stylesheet" href="{% static 'css/tabler.min.css' %}">
</head>
<body class="d-flex flex-column">
  <div class="page page-center">
    <div class="container container-tight py-4">
      <h1 class="text-center mb-4">Cimiento</h1>
      <form class="card card-md" method="post" action="{% url 'cuentas:entrar' %}">
        {% csrf_token %}
        <div class="card-body">
          <h2 class="h2 text-center mb-4">Entrar</h2>
          {% if form.errors %}
          <div class="alert alert-danger" role="alert">El usuario o la contraseña no son correctos.</div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Usuario</label>
            <input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Contraseña</label>
            <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
