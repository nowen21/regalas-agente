{% load static %}<!doctype html>
{# No extiende base.html: aquella muestra la cuenta, y sin base no hay cuenta que leer. #}
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin base de datos - Cimiento</title>
  {% comment %}`EP-028·HU-007` · Con la página suelta de AdminLTE 4.{% endcomment %}
  <link rel="stylesheet" href="{% static 'css/adminlte.min.css' %}">
  <link rel="stylesheet" href="{% static 'bootstrap-icons.min.css' %}">
</head>
<body class="login-page bg-body-secondary">
  <div class="login-box" style="width: 32rem; max-width: 100%">
    <div class="login-logo"><i class="bi bi-bricks me-2" aria-hidden="true"></i><b>Cimiento</b></div>
    <div class="alert alert-danger" role="alert">
      <h4 class="alert-heading"><i class="bi bi-database-x me-2" aria-hidden="true"></i>Cimiento no puede usar su base de datos</h4>
      <p class="mb-0">{{ mensaje }}</p>
    </div>
  </div>
</body>
</html>
